syntax = "proto3";

option csharp_namespace = "Contracts.Grpc.Inventory";

package inventory.v1;

// Inventory servisinin senkron (gRPC) sözleşmesi.
// Ordering servisi sipariş oluşturmadan önce stok ve güncel fiyat bilgisini bu servisten alır.
service InventoryService {
  rpc CheckAvailability (CheckAvailabilityRequest) returns (CheckAvailabilityReply);
  rpc GetProduct (GetProductRequest) returns (ProductReply);
}

// Protobuf'ta decimal tipi yoktur; para değerleri units + nanos olarak taşınır (bkz. DecimalValue.cs).
message DecimalValue {
  int64 units = 1; // sayının tam kısmı
  sfixed32 nanos = 2; // sayının virgülden sonraki kısmı, 10^-9 hassasiyetinde
}

message CheckAvailabilityRequest {
  repeated StockItemRequest items = 1;
}

message StockItemRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message CheckAvailabilityReply {
  bool all_available = 1;
  repeated StockItemAvailability items = 2;
}

message StockItemAvailability {
  string product_id = 1;
  bool exists = 2;
  string product_name = 3;
  DecimalValue unit_price = 4;
  int32 requested_quantity = 5;
  int32 available_quantity = 6;
  bool is_available = 7;
}

message GetProductRequest {
  string product_id = 1;
}

message ProductReply {
  string product_id = 1;
  string sku = 2;
  string name = 3;
  DecimalValue unit_price = 4;
  int32 available_quantity = 5;
}
